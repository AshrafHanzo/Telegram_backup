name = "telegram-drive-relay"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Created by: wrangler kv namespace create SHARES
# Paste the "id" it prints into the line below.
[[kv_namespaces]]
binding = "SHARES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets (never put these directly in this file — set them with):
#   wrangler secret put AUTH_SECRET
#   wrangler secret put ADMIN_SECRET
# AUTH_SECRET signs the short-lived token issued after a correct password.
# ADMIN_SECRET is the bearer token the desktop app uses to register/update/
# revoke shares — pick any long random string for it, and paste the same
# value into the desktop app's Settings → Sharing → "Always-on links" section.
